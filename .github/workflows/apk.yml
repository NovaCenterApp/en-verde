name: APK de Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'android-app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar la firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Faltan los secretos KEYSTORE_B64 y KEYSTORE_PASS (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Preparar el proyecto Android
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp ../index.html ../splash.jpg ../mark.png ../icon-512.png ../icon-192.png www/
          npx cap add android
          # íconos y pantalla de carga de En Verde
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r res/* android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp res/drawable/splash.png {} \;
          # número de versión
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Compilar
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q

      - name: Firmar
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          printf "%s" "$KEYSTORE_B64" | tr -d " \r\n\t" | base64 -d > ks.p12
          IN=android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASS --ks-key-alias enverde --out EnVerde.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify EnVerde.apk
          cp EnVerde.apk "EnVerde-1.0.${{ github.run_number }}.apk"
          rm ks.p12

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: En Verde 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            APK para Android. Descárgala, ábrela y toca «Instalar» (si Android lo pide, permite instalar apps de esta fuente).
            Para actualizar, instala la nueva encima de la anterior: tus datos se quedan.
          files: |
            EnVerde.apk
            EnVerde-1.0.${{ github.run_number }}.apk
