<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E7C46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="splash.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="En Verde">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>En Verde</title>
<style>
/* En Verde. Disposición: una columna del ancho de un teléfono; arriba el resumen, en medio la lista,
   y los dos botones grandes fijos encima de la barra de pestañas. Paleta: verde billete y tinta.
   Tipografía: la del sistema (carga al instante, sin datos), números grandes en peso 800. */
:root {
  color-scheme: light;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: #F2F6F1;
  --surface: #FFFFFF;
  --soft: #E7EEE7;
  --ink: #0F1C13;
  --muted: #566A5C;
  --line: #DBE4DC;
  --axis: #B7C6BB;
  --brand: #0B7A3B;
  --on-brand: #FFFFFF;
  --buy: #14281D;
  --on-buy: #FFFFFF;
  --gain: #0B7A3B;
  --loss: #B3261E;
  --gain-bg: #E1F2E6;
  --loss-bg: #FBE8E5;
  --warn: #7A4300;
  --warn-bg: #FFF2D9;
  --warn-line: #EBCB8B;
  --hero-a: #0C6D35;
  --hero-b: #064424;
  --on-hero: #FFFFFF;
  --hero-soft: rgba(255, 255, 255, .8);
  --hero-loss: #FFC2BB;
  --ring: rgba(11, 122, 59, .26);
  --shadow: 0 1px 2px rgba(15, 28, 19, .05), 0 8px 22px rgba(15, 28, 19, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B120E; --surface: #141F18; --soft: #1C2B22; --ink: #E8F2EB; --muted: #9BB0A2; --line: #26362C; --axis: #3E5346;
    --brand: #35CF7B; --on-brand: #04160B; --buy: #2B4636; --on-buy: #F1F8F3;
    --gain: #4BDB8C; --loss: #FF8F85; --gain-bg: #12301F; --loss-bg: #3A1B18;
    --warn: #F2C879; --warn-bg: #30250E; --warn-line: #5B4519;
    --hero-a: #0F5C31; --hero-b: #08381F; --ring: rgba(53, 207, 123, .34); --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B120E; --surface: #141F18; --soft: #1C2B22; --ink: #E8F2EB; --muted: #9BB0A2; --line: #26362C; --axis: #3E5346;
  --brand: #35CF7B; --on-brand: #04160B; --buy: #2B4636; --on-buy: #F1F8F3;
  --gain: #4BDB8C; --loss: #FF8F85; --gain-bg: #12301F; --loss-bg: #3A1B18;
  --warn: #F2C879; --warn-bg: #30250E; --warn-line: #5B4519;
  --hero-a: #0F5C31; --hero-b: #08381F; --ring: rgba(53, 207, 123, .34); --shadow: none;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.35;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; background: var(--bg); }
@media (min-width: 560px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
#view { height: 100%; display: flex; flex-direction: column; }

/* ---------- barra de arriba ---------- */
.top { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 4px 16px; }
.brand { display: flex; align-items: center; font-weight: 800; font-size: 21px; letter-spacing: -.01em; color: var(--ink); }
.brand svg { width: 28px; height: 28px; margin-right: 8px; color: var(--brand); }
.top-r { display: flex; align-items: center; }
.pill { display: flex; align-items: center; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); margin-right: 4px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); display: block; }
.pill.ok i { background: var(--gain); }
.pill.sync i { background: #D98A00; }
.pill.bad i { background: var(--loss); }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; }
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn[aria-pressed="true"] { background: var(--soft); }
.strip { flex: none; display: flex; padding: 0 16px 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.strip span { margin-right: 14px; }
.strip b { color: var(--ink); font-weight: 800; }
.demo { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; background: var(--warn-bg); border-bottom: 1px solid var(--warn-line); font-size: 13.5px; font-weight: 700; color: var(--ink); }
.demo button { color: var(--brand); font-weight: 800; padding: 8px 12px; }

/* ---------- pantallas ---------- */
.screen { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 18px; }
.screen.home { padding-bottom: 6px; }
.ttl { font-size: 26px; font-weight: 800; letter-spacing: -.02em; padding: 8px 16px 10px; }
.lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }

.stock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 16px 0; }
.stock .card { padding: 12px 14px 13px; }
.stock .val { font-size: 34px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; margin-top: 3px; }
.stock .val small { font-size: 15px; font-weight: 700; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.stock .sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.stock .val.m { font-size: 28px; }
.stock .val.s { font-size: 22px; }

.hero { margin: 10px 16px 0; padding: 16px 18px 14px; border-radius: 22px; color: var(--on-hero); background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); }
.hero .lbl { color: var(--hero-soft); }
.hero .num { font-size: 52px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 2px; }
.hero .num.m { font-size: 44px; }
.hero .num.s { font-size: 36px; }
.hero .num small { font-size: 18px; font-weight: 700; margin-left: 2px; letter-spacing: 0; opacity: .85; }
.hero .neg { color: var(--hero-loss); }


.list { margin: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; width: 100%; padding: 11px 14px; min-height: 64px; border-top: 1px solid var(--line); text-align: left; }
.row:first-child { border-top: 0; }
.tag { font-size: 11.5px; font-weight: 800; letter-spacing: .04em; padding: 6px 0; border-radius: 9px; margin-right: 12px; width: 74px; text-align: center; }
.tag.buy { background: var(--buy); color: var(--on-buy); }
.tag.sell { background: var(--brand); color: var(--on-brand); }
.row .mid { min-width: 0; }
.row .main { display: block; font-weight: 700; font-variant-numeric: tabular-nums; }
.row .sub { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.prow { grid-template-columns: 1fr auto; cursor: default; }
.row .res { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; padding-left: 8px; }
.row .res small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
.res.gain { color: var(--gain); }
.res.loss { color: var(--loss); }
.res.warn { color: var(--warn); }
.dayh { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 20px 6px; font-size: 14px; font-weight: 800; color: var(--muted); }
.dayh .dsum { font-variant-numeric: tabular-nums; }

.empty { margin: 14px 16px 0; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px dashed var(--axis); }
.empty h3 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
.empty p { color: var(--muted); font-size: 15px; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; margin-top: 12px; padding: 12px 16px; min-height: 48px; border-radius: 14px; font-weight: 800; background: var(--soft); color: var(--ink); text-align: center; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.danger { background: var(--loss-bg); color: var(--loss); }
.btn.block { display: flex; width: 100%; }

/* ---------- botones grandes y pestañas ---------- */
.dock { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 16px 12px; background: linear-gradient(to top, var(--bg) 72%, rgba(0, 0, 0, 0)); }
.bigbtn { display: grid; justify-items: center; align-content: center; min-height: 96px; border-radius: 24px; text-align: center; box-shadow: 0 6px 16px rgba(10, 30, 18, .18); }
.bigbtn svg { width: 26px; height: 26px; }
.bigbtn .t { font-size: 27px; font-weight: 800; letter-spacing: .01em; line-height: 1.1; margin-top: 2px; }
.bigbtn .s { font-size: 13px; font-weight: 600; opacity: .85; }
.bigbtn.buy { background: var(--buy); color: var(--on-buy); }
.bigbtn.sell { background: var(--brand); color: var(--on-brand); }
.bigbtn:active { transform: scale(.98); }
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
.tab { display: grid; justify-items: center; align-content: center; min-height: 54px; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tab svg { width: 24px; height: 24px; margin-bottom: 2px; }
.tab[aria-current="page"] { color: var(--brand); }

/* ---------- entrada de una operación ---------- */
.entry { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); animation: up .18s ease-out; }
.entry-top { flex: none; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; padding: 8px 6px; background: var(--buy); color: var(--on-buy); }
.entry[data-type="sell"] .entry-top { background: var(--brand); color: var(--on-brand); }
.entry-top h2 { text-align: center; font-size: 20px; font-weight: 800; }
.entry-body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 16px 6px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.entry > .fields { flex: none; padding: 12px 16px 8px; }
.field { display: block; width: 100%; min-height: 76px; padding: 8px 12px 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; text-align: left; }
.field.on { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); }
.field .fl { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.field .fv { display: flex; align-items: baseline; margin-top: 2px; min-height: 38px; font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.field .fv .u { font-size: 16px; font-weight: 700; color: var(--muted); margin: 0 5px 0 0; letter-spacing: 0; }
.field .fv .u.r { margin: 0 0 0 6px; }
.field .fv .ph { color: var(--axis); }
.caret { display: none; width: 2px; height: 28px; background: var(--brand); margin-left: 2px; align-self: center; animation: blink 1s steps(1) infinite; }
.field.on .caret { display: block; }
.chips { display: flex; flex-wrap: wrap; margin: 6px -4px 0; min-height: 4px; }
.chip { display: inline-flex; align-items: center; min-height: 40px; margin: 4px; padding: 8px 14px; border-radius: 999px; background: var(--soft); font-weight: 700; font-size: 14.5px; }
.figs { margin-top: 8px; padding: 12px 16px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.figs .l { font-size: 13px; font-weight: 700; color: var(--muted); }
.figs .big { font-size: 42px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.figs .big.m { font-size: 34px; }
.figs .big.s { font-size: 26px; }
.figs .big small { font-size: 18px; font-weight: 700; margin-left: 2px; color: var(--muted); letter-spacing: 0; }
.figs .mid { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.figs .sep { height: 1px; background: var(--line); margin: 10px 0 8px; }
.figs.dim .big, .figs.dim .mid { color: var(--axis); }
.note { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 15.5px; line-height: 1.3; background: var(--soft); }
.note small { display: block; font-weight: 600; font-size: 13px; opacity: .85; margin-top: 2px; }
.note.gain { background: var(--gain-bg); color: var(--gain); }
.note.loss { background: var(--loss-bg); color: var(--loss); }
.note.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
.short { margin-top: 10px; padding: 12px; border-radius: 14px; background: var(--warn-bg); border: 1px solid var(--warn-line); }
.short p { font-size: 14.5px; }
.short .field { margin-top: 8px; min-height: 64px; }
.short .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.when { margin-top: 6px; font-size: 14px; color: var(--muted); }
.when .wr { display: flex; align-items: center; justify-content: space-between; }
.when button { color: var(--brand); font-weight: 700; padding: 10px 4px; }
.dt { width: 100%; margin: 0 0 6px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.del { display: block; margin: 4px auto 6px; padding: 12px; font-weight: 800; color: var(--loss); }
.keypad { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 16px 4px; }
.key { display: grid; place-items: center; height: 54px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 25px; font-weight: 700; user-select: none; -webkit-user-select: none; }
.key:active { background: var(--soft); }
.key svg { width: 26px; height: 26px; }
.entry-actions { flex: none; padding: 6px 16px 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.go { display: block; width: 100%; min-height: 60px; border-radius: 18px; font-size: 21px; font-weight: 800; text-align: center; background: var(--brand); color: var(--on-brand); }
.entry[data-type="buy"] .go { background: var(--buy); color: var(--on-buy); }
.go[disabled] { opacity: .35; cursor: default; }
@media (max-height: 740px) {
  .key { height: 46px; font-size: 22px; }
  .figs .big { font-size: 36px; }
  .figs .big.m { font-size: 30px; }
  .figs .big.s { font-size: 24px; }
  .figs .mid { font-size: 26px; }
  .field { min-height: 66px; }
  .field .fv { font-size: 26px; min-height: 32px; }
  .caret { height: 24px; }
  .go { min-height: 54px; }
}
@media (max-height: 700px) {
  .entry-top { padding: 0 6px; }
  .entry > .fields { padding: 8px 16px 4px; }
  .field { min-height: 60px; padding-top: 8px; padding-bottom: 8px; }
  .figs { display: grid; grid-template-columns: 1fr auto; column-gap: 14px; align-items: end; margin-top: 4px; padding: 8px 14px 10px; }
  .figs > :nth-child(1) { grid-area: 1 / 1; }
  .figs > :nth-child(2) { grid-area: 2 / 1; min-width: 0; }
  .figs > :nth-child(3) { display: none; }
  .figs > :nth-child(4) { grid-area: 1 / 2; text-align: right; }
  .figs > :nth-child(5) { grid-area: 2 / 2; text-align: right; }
  .figs .big { font-size: 30px; }
  .figs .big.m { font-size: 25px; }
  .figs .big.s { font-size: 20px; }
  .figs .big small { font-size: 14px; }
  .figs .mid { font-size: 22px; }
  .note { margin-top: 6px; padding: 8px 12px; }
  .short { margin-top: 6px; padding: 10px; }
  .short .field { min-height: 56px; }
}
@media (max-height: 620px) { .key { height: 40px; } .keypad { gap: 6px; } }

/* ---------- ganancias ---------- */
.sumcard { margin: 4px 16px 0; padding: 16px 18px; }
.sumcard .num { font-size: 48px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 2px; }
.sumcard .num small { font-size: 18px; font-weight: 700; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.sumcard .num.neg { color: var(--loss); }
.sumcard .num.m { font-size: 40px; }
.sumcard .num.s { font-size: 32px; }
.sumcard .mn.m { font-size: 15px; }
.sumcard .mn.s { font-size: 13px; }
.sumcard .row3, .sumcard .pers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.sumcard .mn { font-size: 18px; font-weight: 800; margin-top: 1px; }
.sumcard .mn.neg { color: var(--loss); }
.sumcard .pers .lbl { white-space: nowrap; }
@media (max-width: 350px) { .sumcard .pers .lbl { font-size: 11.5px; } .sumcard .pers { gap: 4px; } }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); margin: 14px 16px 0; padding: 4px; background: var(--soft); border-radius: 14px; }
.seg button { padding: 10px 0; min-height: 44px; border-radius: 11px; font-weight: 700; text-align: center; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chart { margin: 12px 16px 0; padding: 14px 12px 8px; }
.chart h3 { font-size: 15px; font-weight: 800; padding: 0 4px; }
.readout { display: flex; align-items: flex-start; justify-content: space-between; padding: 6px 4px 12px; min-height: 52px; }
.readout .rd { font-size: 14.5px; font-weight: 800; }
.readout .rs { font-size: 13px; color: var(--muted); margin-top: 1px; }
.readout .rv { font-size: 24px; font-weight: 800; letter-spacing: -.02em; text-align: right; white-space: nowrap; padding-left: 8px; }
.readout .rv small { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.plotwrap { display: grid; grid-template-columns: 40px 1fr; }
.yax { position: relative; }
.yax span { position: absolute; right: 8px; transform: translateY(50%); font-size: 11px; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.area { position: relative; }
.gl { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.gl.zero { background: var(--axis); }
.cols { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.col { position: relative; height: 100%; border-radius: 10px; }
.col[aria-pressed="true"] { background: var(--soft); }
.bar { position: absolute; left: 50%; width: 22px; margin-left: -11px; background: var(--gain); }
.bar.up { border-radius: 4px 4px 0 0; }
.bar.dn { border-radius: 0 0 4px 4px; background: var(--loss); }
.xax { display: grid; grid-template-columns: 40px 1fr; }
.xl { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.xl span { text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 6px 0 4px; white-space: nowrap; }
.xl span.cur { color: var(--ink); font-weight: 800; }

/* ---------- ajustes, hojas y avisos ---------- */
.group { margin: 0 16px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.gh { padding: 14px 16px 2px; font-size: 13px; font-weight: 800; color: var(--muted); }
.set { display: grid; grid-template-columns: 1fr auto; align-items: center; width: 100%; padding: 12px 16px; min-height: 60px; border-top: 1px solid var(--line); text-align: left; }
.set:first-child, .gh + .set { border-top: 0; }
.set .st { display: block; font-weight: 700; }
.set .sd { display: block; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.set svg { width: 20px; height: 20px; color: var(--muted); }
.set.danger .st { color: var(--loss); }
.sw { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--axis); margin-left: 12px; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.sw.on { background: var(--brand); }
.sw.on::after { transform: translateX(20px); }
.fine { padding: 0 20px 14px; font-size: 13.5px; color: var(--muted); }
.ver { text-align: center; font-size: 12.5px; color: var(--muted); padding: 4px 16px 8px; }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; display: flex; flex-direction: column; background: var(--bg); animation: up .18s ease-out; }
.sheet-top { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-top h2 { font-size: 19px; font-weight: 800; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
.sheet-body p { margin-bottom: 12px; }
.sheet-body ol { margin: 0 0 12px; padding-left: 22px; }
.sheet-body li { margin-bottom: 8px; }
.sheet-body .ex { padding: 12px 14px; border-radius: 14px; background: var(--soft); margin-bottom: 12px; }
.tx { display: block; width: 100%; min-height: 200px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: 12.5px/1.45 var(--mono); resize: vertical; }
.acts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acts2 .btn { margin-top: 10px; }
.scrim { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 12, 8, .55); animation: fade .15s; }
.dlg { width: 100%; padding: 20px 18px 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 24px 24px 0 0; }
.dlg h3 { font-size: 20px; font-weight: 800; }
.dlg p { margin-top: 8px; color: var(--muted); }
.dlg .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
#toast { position: absolute; left: 12px; right: 12px; top: 58px; z-index: 50; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 16px; border-radius: 18px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px rgba(0, 0, 0, .28); animation: down .2s ease-out; }
.toast.gain { background: var(--brand); color: var(--on-brand); }
.toast.loss { background: var(--loss); color: #fff; }
.toast .t1 { font-size: 20px; font-weight: 800; line-height: 1.15; }
.toast .t2 { font-size: 13px; opacity: .85; margin-top: 2px; }
.toast .undo { margin-left: 12px; padding: 10px 14px; min-height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .2); color: inherit; font-weight: 800; white-space: nowrap; }
.banner { margin: 8px 16px 0; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn); font-size: 14px; font-weight: 600; }

/* ---------- escáner de precio por zona ---------- */
.scanbtn { display: grid; grid-template-columns: auto 1fr auto; align-items: center; width: calc(100% - 32px); margin: 10px 16px 0; padding: 9px 14px 9px 9px; min-height: 64px; text-align: left; background: var(--surface); border: 1.5px solid var(--brand); border-radius: 18px; box-shadow: var(--shadow); }
.scanbtn:active { transform: scale(.99); }
.sb-i { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--gain-bg); color: var(--brand); margin-right: 12px; }
.sb-i svg { width: 28px; height: 28px; }
.sb-t { min-width: 0; }
.sb-1 { display: block; font-weight: 800; font-size: 16.5px; line-height: 1.2; }
.sb-2 { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scanbtn > svg { width: 20px; height: 20px; color: var(--muted); margin-left: 8px; }

.scanner { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 35; display: flex; flex-direction: column; background: var(--bg); animation: up .18s ease-out; }
.sc-top { flex: none; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; padding: 8px 6px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sc-top h2 { text-align: center; font-size: 19px; font-weight: 800; }
.sc-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 16px 14px; }
.sc-actions { flex: none; padding: 6px 16px 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.sc-zone { display: flex; align-items: center; width: 100%; padding: 8px 14px; min-height: 46px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; }
.sc-zone svg { width: 20px; height: 20px; color: var(--brand); margin-right: 8px; flex: none; }
.sc-zone .zn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-zone .zc { color: var(--brand); font-weight: 800; margin-left: 10px; flex: none; }

/* tablero digital, oscuro igual en claro y en oscuro: se lee como un instrumento.
   Cada tarjeta tiene tres estados: wait (espera su turno, apagada), run (escaneando: brilla y pasa un rayo de luz) y done (con su precio). */
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.gcard {
  --ac: 96, 255, 196;                      /* acento mientras escanea (rgb) */
  --lv: 143, 179, 160;                     /* color del nivel cuando ya hay resultado (rgb) */
  --hud: rgba(var(--ac), .5);
  position: relative; z-index: 0; min-width: 0; overflow: hidden; padding: 0 6px 10px; text-align: center; border-radius: 20px;
  color: #EAF8F0; background: radial-gradient(120% 75% at 50% 0%, #163227 0%, #0A150F 60%, #070F0A 100%);
  border: 1px solid rgba(var(--ac), .16); box-shadow: 0 10px 24px rgba(3, 12, 7, .32);
  transition: opacity .35s, border-color .35s, box-shadow .35s;
}
.gcard.lv-cheap { --lv: 45, 245, 154; }
.gcard.lv-normal { --lv: 255, 212, 59; }
.gcard.lv-expensive { --lv: 255, 84, 112; }
.gcard.wait { opacity: .5; }
.gcard.run, .gcard.load { border-color: rgba(var(--ac), .6); box-shadow: 0 0 0 1px rgba(var(--ac), .18), 0 0 26px rgba(var(--ac), .24), 0 10px 24px rgba(3, 12, 7, .32); }
.gcard.done { --hud: rgba(var(--lv), .6); border-color: rgba(var(--lv), .42); box-shadow: 0 0 20px rgba(var(--lv), .16), 0 10px 24px rgba(3, 12, 7, .32); }
.gcard.nodata { opacity: .85; }
/* rejilla fina que se pierde hacia los bordes */
.gcard::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(var(--ac), .08) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--ac), .08) 1px, transparent 1px);
  background-size: 16px 16px; background-position: center top;
  -webkit-mask-image: radial-gradient(closest-side, #000 35%, transparent 100%); mask-image: radial-gradient(closest-side, #000 35%, transparent 100%); }
/* esquinas tipo HUD */
.gcard::after { content: ''; position: absolute; top: 28px; right: 7px; bottom: 7px; left: 7px; z-index: 1; pointer-events: none;
  background:
    linear-gradient(var(--hud), var(--hud)) 0 0 / 10px 1.5px no-repeat, linear-gradient(var(--hud), var(--hud)) 0 0 / 1.5px 10px no-repeat,
    linear-gradient(var(--hud), var(--hud)) 100% 0 / 10px 1.5px no-repeat, linear-gradient(var(--hud), var(--hud)) 100% 0 / 1.5px 10px no-repeat,
    linear-gradient(var(--hud), var(--hud)) 0 100% / 10px 1.5px no-repeat, linear-gradient(var(--hud), var(--hud)) 0 100% / 1.5px 10px no-repeat,
    linear-gradient(var(--hud), var(--hud)) 100% 100% / 10px 1.5px no-repeat, linear-gradient(var(--hud), var(--hud)) 100% 100% / 1.5px 10px no-repeat; }
/* el rayo de luz que baja por la tarjeta que está escaneando */
.gscan { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; pointer-events: none; opacity: 0; transform: translateY(-100%);
  background: linear-gradient(to bottom, rgba(var(--ac), 0) 0%, rgba(var(--ac), 0) 62%, rgba(var(--ac), .09) 94%, rgba(var(--ac), .7) 100%); }
.gcard.run .gscan, .gcard.load .gscan { opacity: 1; animation: beam 1.1s linear infinite; }
/* franja de arriba: de dónde salen los precios de esta tarjeta */
.gtag { display: flex; align-items: center; justify-content: center; margin: 0 -6px 7px; padding: 6px 0 5px; font: 800 10px/1 var(--mono); letter-spacing: .13em; color: #9CD9BB; background: rgba(var(--ac), .07); border-bottom: 1px solid rgba(var(--ac), .14); }
.gtag i { flex: none; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 7px currentColor; }
.gtag.example { color: #FFD966; background: rgba(255, 212, 59, .09); border-bottom-color: rgba(255, 212, 59, .22); }
.gtag.zone { color: #5BF0A9; }
.gtag.own { color: #B6DCC8; }
.gtag.none { color: #8FA89A; }
.gtt { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: #D8F3E5; }
/* el dial: un resplandor detrás (verde mientras escanea; del color del nivel al terminar) y el número en el centro */
.gdial { position: relative; margin-top: 3px; }
.gdial::before, .gdial::after { content: ''; position: absolute; top: 6%; right: 6%; bottom: -8%; left: 6%; z-index: 0; pointer-events: none; }
.gdial::before { background: radial-gradient(closest-side, rgba(var(--ac), .2), rgba(var(--ac), 0)); transition: opacity .6s; }
.gdial::after { background: radial-gradient(closest-side, rgba(var(--lv), .3), rgba(var(--lv), 0)); opacity: 0; transition: opacity .6s; }
.gcard.done .gdial::after { opacity: 1; }
.gcard.done .gdial::before { opacity: .4; }
.gsvg { display: block; position: relative; z-index: 1; width: 100%; height: auto; }
.gsvg .rg { fill: none; stroke: rgba(var(--ac), .22); stroke-width: 1; stroke-dasharray: 1.5 4.3; transform-origin: 100px 94px; }
.gcard.run .gsvg .rg, .gcard.load .gsvg .rg { animation: spin 16s linear infinite; }
.gsvg .rl { fill: none; stroke: rgba(var(--ac), .28); stroke-width: .8; }
.gsvg .ro { fill: none; stroke: rgba(214, 246, 230, .2); stroke-width: .8; }
.gsvg .tk { fill: none; stroke: rgba(214, 246, 230, .4); stroke-width: .9; }
.gsvg .tm { fill: none; stroke: rgba(214, 246, 230, .8); stroke-width: 1.5; }
.gsvg .te { fill: rgba(196, 232, 213, .78); font-size: 13.5px; font-weight: 700; font-family: var(--mono); letter-spacing: -.02em; }
.gsvg .bar { opacity: .2; transition: opacity .7s ease-out; }
.gsvg .bar.on { opacity: 1; transition-duration: .06s; }
.gsvg .lv-cheap { fill: #2DF59A; }
.gsvg .lv-normal { fill: #FFD43B; }
.gsvg .lv-expensive { fill: #FF5470; }
.gsvg .lv-none { fill: #8FB3A0; }
.gsvg .bar.hot { fill: #FFFFFF; }
.gsvg .needle { fill: #F6FFFA; stroke: rgba(var(--ac), .6); stroke-width: 3; stroke-linejoin: round; paint-order: stroke; }
.gsvg .caret { fill: rgb(var(--ac)); }
.gsvg .hub { fill: #07100B; stroke: rgb(var(--ac)); stroke-width: 1.8; }
.gsvg .hubd { fill: #F6FFFA; }
.gcard.done .gsvg .needle { stroke: rgba(var(--lv), .65); }
.gcard.done .gsvg .caret { fill: rgb(var(--lv)); }
.gcard.done .gsvg .hub { stroke: rgb(var(--lv)); }
.gcard.nodata .gsvg .nd, .gcard.nodata .gsvg .hub, .gcard.nodata .gsvg .hubd { opacity: .3; }
.gread { position: absolute; left: 0; right: 0; top: 67%; z-index: 2; pointer-events: none; }
.gnum { font-size: 31px; font-size: clamp(24px, 8.2vw, 38px); font-weight: 800; letter-spacing: -.01em; line-height: 1.05; font-variant-numeric: tabular-nums; color: #F5FFF9; text-shadow: 0 0 12px rgba(var(--ac), .55); }
.gnum.n5 { font-size: 26px; font-size: clamp(21px, 6.8vw, 32px); }
.gnum.n6 { font-size: 20px; font-size: clamp(16px, 5.4vw, 24px); }
.gnum.n8 { font-size: 16px; font-size: clamp(13px, 4.3vw, 20px); }
.gcard.wait .gnum { color: rgba(245, 255, 249, .55); text-shadow: none; }
.gcard.nodata .gnum { color: rgba(245, 255, 249, .4); text-shadow: none; animation: none; }
.gcard.done .gnum { text-shadow: 0 0 14px rgba(var(--lv), .55); animation: lock .4s ease-out; }
.gu { margin-top: 3px; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: rgba(196, 232, 213, .72); }
.glev { display: inline-flex; align-items: center; margin-top: 8px; padding: 4px 12px; min-height: 28px; border-radius: 999px; font-size: 13.5px; font-weight: 800;
  color: rgb(var(--lv)); background: rgba(var(--lv), .12); border: 1px solid rgba(var(--lv), .45); box-shadow: 0 0 14px rgba(var(--lv), .2);
  opacity: 0; transform: translateY(4px); transition: opacity .35s, transform .35s; }
.gcard.done .glev { opacity: 1; transform: none; }
.glev i { width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 7px currentColor; display: block; }
.gmeta { margin-top: 6px; min-height: 16px; font-size: 11.5px; font-weight: 600; color: rgba(196, 232, 213, .72); font-variant-numeric: tabular-nums; }
.sc-st { display: flex; align-items: center; justify-content: center; margin-top: 10px; min-height: 24px; font-size: 14px; font-weight: 700; color: var(--muted); }
.sc-st i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); margin-right: 8px; animation: pulse 1s ease-in-out infinite; display: block; }
.sc-st svg { width: 18px; height: 18px; margin-right: 6px; color: var(--brand); }
.sc-st.done { color: var(--ink); }
.sc-note { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn); font-size: 14px; font-weight: 600; }
.sc-note b { font-weight: 800; }
.sc-note.info { background: var(--soft); border-color: var(--line); color: var(--ink); }
.sc-note button { display: block; margin-top: 2px; padding: 8px 0 2px; font-weight: 800; text-decoration: underline; text-align: left; }
.legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; margin-right: 12px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .16); }
.legend i.lv-cheap { background: #2DF59A; }
.legend i.lv-normal { background: #FFD43B; }
.legend i.lv-expensive { background: #FF5470; }
.legend em { font-style: normal; font-weight: 600; }
.sentence { margin-top: 12px; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 18px; font-weight: 700; line-height: 1.35; transition: opacity .35s; }
.sentence b { font-weight: 800; }
.sentence b.up { color: var(--gain); }
.sentence b.dn { color: var(--loss); }
.sc-src { margin-top: 10px; padding: 0 4px; font-size: 13px; color: var(--muted); transition: opacity .35s; }
.sc-body.run .sentence, .sc-body.run .sc-src { opacity: 0; }

/* elegir el municipio */
.sheet-body.zsheet { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.zhead { flex: none; padding: 14px 16px 8px; }
.zhead h3 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.zhead p { margin: 6px 0 12px; color: var(--muted); font-size: 15px; }
.search { display: block; width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; -webkit-appearance: none; appearance: none; }
.search:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 4px var(--ring); }
.zl { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px 16px; }
.zp { position: sticky; top: 0; z-index: 1; padding: 14px 4px 6px; font-size: 13px; font-weight: 800; color: var(--muted); background: var(--bg); }
.zg { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.zi { display: grid; grid-template-columns: 1fr auto; align-items: center; width: 100%; min-height: 52px; padding: 8px 14px; border-top: 1px solid var(--line); text-align: left; font-weight: 700; }
.zi:first-child { border-top: 0; }
.zi small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
.zi svg { width: 22px; height: 22px; color: var(--brand); }
.zi[aria-current="true"] { background: var(--gain-bg); }

/* qué se comparte */
.kv { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 12px; overflow: hidden; }
.kv > div { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-top: 1px solid var(--line); }
.kv > div:first-child { border-top: 0; }
.kv span { color: var(--muted); font-size: 14px; }
.kv b { font-weight: 800; text-align: right; margin-left: 12px; }
.kv b.mono { font: 700 13px var(--mono); }
.fine2 { font-size: 13.5px; color: var(--muted); }
.sheet-body ul { margin: 0 0 12px; padding-left: 22px; }
.sheet-body ul.never li::marker { color: var(--loss); }
@media (max-width: 350px) { .sb-1 { font-size: 15px; } .gtag { letter-spacing: .07em; font-size: 9.5px; } .gtt { font-size: 12.5px; } .glev { font-size: 12.5px; padding: 3px 10px; } .gmeta { font-size: 11px; } }
@media (max-height: 700px) { .gdial { margin-top: 0; } .sentence { font-size: 16.5px; padding: 12px 14px; } }

@keyframes pulse { 50% { opacity: .3; } }
@keyframes lock { 0% { transform: scale(1.1); } 100% { transform: none; } }
@keyframes beam { from { transform: translateY(-100%); } to { transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes down { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- cuentas ---------- */
.auth { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; padding: 12px 16px 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#view > .auth { height: 100%; }
.aw { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 16px 4px; }
.aw-logo { width: 64px; height: 64px; color: var(--brand); }
.aw-logo svg { width: 64px; height: 64px; }
.aw h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin-top: 12px; }
.aw-sub { font-size: 18px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.aw-pts { list-style: none; margin: 22px 0 0; padding: 0; }
.aw-pts li { display: flex; align-items: flex-start; margin-bottom: 12px; font-size: 16px; font-weight: 600; }
.aw-pts svg { flex: none; width: 22px; height: 22px; color: var(--brand); margin-right: 10px; }
.aw-acts { flex: none; }
.aw-acts .btn { margin-top: 10px; min-height: 54px; font-size: 17px; }
.ah { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; margin: -4px -8px 6px; }
.ah h2 { text-align: center; font-size: 20px; font-weight: 800; }
.ap { margin: 4px 2px 12px; font-size: 16px; }
.aform { margin-bottom: 6px; }
.af { display: block; margin-bottom: 12px; }
.afl { display: block; font-size: 13.5px; font-weight: 800; color: var(--muted); margin: 0 2px 5px; }
.afl i { font-style: normal; font-weight: 600; }
.af input, .aph { display: block; width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; -webkit-appearance: none; appearance: none; }
.af input:focus, .aph:focus-within { border-color: var(--brand); outline: none; box-shadow: 0 0 0 4px var(--ring); }
.aph { display: flex; align-items: center; padding: 0 0 0 14px; }
.aph b { font-weight: 800; color: var(--muted); margin-right: 6px; }
.aph input { flex: 1; min-width: 0; border: 0; min-height: 48px; padding: 10px 12px 10px 0; box-shadow: none !important; background: transparent; }
.af.bad input, .af.bad .aph, .af.bad .azone { border-color: var(--loss); }
.afh, .afh2 { display: block; font-size: 13px; color: var(--muted); margin: 5px 2px 0; }
.afh2 { margin: -4px 2px 14px; }
.afe { display: block; font-size: 13.5px; font-weight: 700; color: var(--loss); margin: 5px 2px 0; }
.apin { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.azone { display: flex; align-items: center; width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16.5px; text-align: left; }
.azone > span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.azone svg { flex: none; width: 20px; height: 20px; color: var(--brand); margin-right: 8px; }
.azone svg:last-child { color: var(--muted); margin: 0 0 0 8px; }

<script>
/* En Verde · escáner de precio por zona (lógica)

   "Te compran a"  = mediana de las ventas (k:'s')  de la zona en las últimas 24 h.
   "Te venden a"   = mediana de las compras (k:'b') de la zona en las últimas 24 h.

  function chartHTML(ser, mode, sel) {
    var now = NOW(), maxPos = 0, maxNeg = 0;
    ser.forEach(function (g) { if (g.profit > 0) maxPos = Math.max(maxPos, g.profit); else if (g.profit < 0) maxNeg = Math.max(maxNeg, -g.profit); });
    var head = '<h3>Ganancia ' + GM[mode].t + '</h3>';
    if (!maxPos && !maxNeg) return '<section class="card chart">' + head + '<p class="muted" style="padding:10px 4px 12px">Todavía no hay ventas en este tiempo.</p></section>';
    var step = niceStep(Math.max(maxPos, maxNeg)), kt = Math.ceil(maxPos / step), kb = Math.ceil(maxNeg / step);
    var top = kt * step, bot = kb * step, span = top + bot, H = kb > 0 ? 168 : 128, base = bot / span * H, k, grid = '', yl = '';
    var big = Math.max(top, bot), scale = big >= 1e6 ? 'M' : big >= 10000 ? 'K' : '';
    for (k = -kb; k <= kt; k++) {
      var y = (base + k * step / span * H).toFixed(1);
      grid += '<div class="gl' + (k === 0 ? ' zero' : '') + '" style="bottom:' + y + 'px"></div>';
      yl += '<span style="bottom:' + y + 'px">' + (S.hide ? '' : tick(k * step, scale)) + '</span>';
    }
    var cols = '', xl = '';
    ser.forEach(function (g, i) {
      var p = g.profit, hgt = Math.max(2, Math.abs(p) / span * H), bar = '';
      if (Math.abs(p) > 1e-9) bar = p > 0
        ? '<span class="bar up" style="bottom:' + base.toFixed(1) + 'px;height:' + hgt.toFixed(1) + 'px"></span>'
        : '<span class="bar dn" style="bottom:' + (base - hgt).toFixed(1) + 'px;height:' + hgt.toFixed(1) + 'px"></span>';
      var lab = EV.periodLabel(g.start, mode, now) + ': ' + (g.sales ? (S.hide ? 'ganancia oculta' : EV.signed(p) + ' CUP') : 'sin ventas');
      cols += '<button class="col" data-act="bar" data-i="' + i + '" aria-pressed="' + (i === sel) + '" aria-label="' + esc(lab) + '">' + bar + '</button>';

      '<div class="rv">' + (g.sales ? mSigned(g.profit) : '—') + '<small> CUP</small></div></div>';
    return '<section class="card chart">' + head + ro +

      '<div class="xax"><div></div><div class="xl">' + xl + '</div></div></section>';
  }
  function viewGains(b) {

  /* ---------- calculadora (gratis siempre) ---------- */
  function calcNum(s) {
    s = String(s == null ? '' : s).replace(/\s/g, '');
    if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');     // 1,000 o 1,000.5: la coma es de miles
    else s = s.replace(',', '.');                                          // 990,5: la coma es decimal
    var v = parseFloat(s);
    return isFinite(v) && v >= 0 ? v : NaN;
  }
  function calcBody() {
    var C = S.calc || (S.calc = { m: 'sell', q: '', p: '', c: '' }), b = EV.replay(S.mode === 'demo' ? S.demo : S.real), sell = C.m === 'sell';
    function inp(id, key, label, ph) { return '<label class="af" for="' + id + '"><span class="afl">' + label + '</span><input id="' + id + '" data-cf="' + key + '" value="' + esc(C[key] || '') + '" type="text" inputmode="decimal" autocomplete="off" placeholder="' + ph + '"></label>'; }
    var h = '<div class="seg pm two"><button data-act="calc-m" data-m="sell"' + (sell ? ' aria-selected="true"' : '') + '>Si vendo</button><button data-act="calc-m" data-m="buy"' + (!sell ? ' aria-selected="true"' : '') + '>Si compro</button></div><div class="aform">';
    h += inp('c-q', 'q', 'Dólares', '100') + inp('c-p', 'p', sell ? 'Precio de venta (CUP por dólar)' : 'Precio de compra (CUP por dólar)', '1,000');
    if (sell) h += inp('c-c', 'c', 'Lo que te costó cada dólar', b.usd > 0 && !S.hide ? EV.fmt(Math.round(b.avg * 100) / 100, 2) : '980') +
      (b.usd > 0 ? '<button class="alink in" data-act="calc-avg">Usar mi costo promedio' + (S.hide ? '' : ' (' + EV.money(b.avg) + ')') + '</button>' : '');
    h += '</div><div class="calcout" id="calc-out" aria-live="polite">' + calcOut() + '</div><p class="fine2">La calculadora no registra nada. Es gratis siempre.</p>';
    return h;
  }
  function calcOut() {
    var C = S.calc, b = EV.replay(S.mode === 'demo' ? S.demo : S.real), q = calcNum(C.q), p = calcNum(C.p);
    if (!(q > 0) || !(p > 0)) return '<span class="co-h">Escribe dólares y precio.</span>';
    if (C.m === 'sell') {
      var c = C.c !== '' && C.c != null ? calcNum(C.c) : (b.usd > 0 ? b.avg : NaN);
      var out = '<div class="co-r"><span>Recibes</span><b>' + EV.money(q * p) + ' CUP</b></div>';
      if (!(c >= 0)) return out + '<span class="co-h">Escribe lo que te costó cada dólar para ver la ganancia.</span>';
      var g = (p - c) * q;
      return out + '<div class="co-r big ' + (g > 0.005 ? 'up' : g < -0.005 ? 'dn' : '') + '"><span>' + (g < -0.005 ? 'Pierdes' : 'Ganas') + '</span><b>' + EV.money(Math.abs(g)) + ' CUP</b></div>' +
        '<div class="co-r"><span>Por dólar</span><b>' + EV.signed(Math.round((p - c) * 100) / 100) + ' CUP</b></div>';
    }
    var nu = b.usd + q, na = (b.cost + q * p) / nu;
    return '<div class="co-r big"><span>Pagas</span><b>' + EV.money(q * p) + ' CUP</b></div>' +

  /* ---------- servidor (versión publicada) ----------
     Si la página trae window.EV_CONFIG (la versión de GitHub Pages), las cuentas, las operaciones, la cuota, las ofertas,
     el chat y los precios de zona van al servidor. El teléfono guarda una copia: sin internet la app sigue funcionando y
     sincroniza cuando vuelve. Las reglas (24 h, cuota, 48 h, una oferta por tipo) las hace cumplir el servidor. */
  function iso(ms) { return new Date(ms).toISOString(); }
  function standalone() { try { return !!((window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) || navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); } catch (e) { return false; } }
  function ms(s) { return s ? Date.parse(s) : 0; }
  function sbMsg(e) { return e && e.offline ? 'Sin conexión. Inténtalo cuando tengas internet.' : (e && e.message) || 'No se pudo. Inténtalo de nuevo.'; }
  /* El perfil del servidor → la forma que usa la app */
  function accFromProfile(p, email, old) {
    var a = old || {};
    a.id = p.id; a.nick = p.nick; a.email = EVAcc.normEmail(email || a.email || ''); a.zone = p.zone; a.phone = p.phone;
    a.created = ms(p.created_at); a.verified = ms(p.verified_at) || null; a.gems = p.gems; a.ref = p.ref_slug; a.refDone = p.ref_done;
    a.exempt = !!p.is_admin; a.srvAdmin = !!p.is_admin; a.cancelled = p.cancelled_at ? { t: ms(p.cancelled_at) } : null;
    a.remote = true; a.pay = a.pay || {}; a.gemLog = a.gemLog || []; a.passHash = 'srv'; a.termsAt = ms(p.terms_at) || null;
    return a;
  }
  function remoteLoadProfile() {
    var u = SB.user();
    if (!u) return Promise.reject({ message: 'Sin sesión' });
    return SB.rest('GET', 'profiles?select=*&id=eq.' + u.id).then(function (rows) {
      if (!rows || !rows.length) throw { message: 'No encontramos tu perfil.' };
      var a = accFromProfile(rows[0], u.email, REG.list[u.id]);
      REG.list = {}; REG.list[a.id] = a; REG.cur = a.id; saveReg();
      return a;
    });
  }
  /* Pagos y gemas del servidor → a.pay / a.gemLog (con eso la app calcula y muestra la cuota igual que el servidor) */
  function remotePullAccount() {
    var a = me(); if (!a || !a.remote) return Promise.resolve();
    return Promise.all([
      SB.rest('GET', 'profiles?select=*&id=eq.' + a.id),
      SB.rest('GET', 'payments?select=*&user_id=eq.' + a.id),
      SB.rest('GET', 'gem_log?select=n,why,t&user_id=eq.' + a.id + '&order=t'),
      SB.rest('GET', 'app_config?select=key,value')
    ]).then(function (r) {
      if (r[0] && r[0][0]) accFromProfile(r[0][0], a.email, a);
      a.pay = {};
      (r[1] || []).forEach(function (p) { a.pay[p.month] = { m: p.method, amt: +p.amount, op: p.op_number, code: p.cash_code, st: p.status, at: ms(p.created_at) }; });
      a.gemLog = (r[2] || []).map(function (g) { return { n: g.n, why: g.why, t: ms(g.t) }; });
      (r[3] || []).forEach(function (c) { if (c.key === 'tm_dest') REG.cfg.tm = c.value || ''; });
      saveReg();
      if (a.cancelled) { logout(); S.auth.step = 'login'; S.auth.err.top = CANCEL_MSG; render(); }
    });

  /* ---------- operaciones: copia local + sincronización ---------- */
  var SYNC = { busy: false, timer: 0, lastPull: 0, err: '' };
  function opToRow(o) { return { id: o.id, type: o.type, usd: o.usd, price: o.price, t: iso(o.t), extra: o.extra == null ? null : o.extra, deleted: !!o.del }; }
  function rowToOp(r) {
    return { id: r.id, type: r.type, usd: +r.usd, price: +r.price, t: ms(r.t), u: ms(r.updated_at), c: ms(r.created_at), extra: r.extra == null ? null : +r.extra, del: r.deleted ? 1 : 0, s: 1 };
  }
  /* Lo que cambió en el teléfono y todavía no llegó al servidor queda marcado con p: 1 */
  function markPending(next, prev) {
    var old = {}; (prev || []).forEach(function (o) { old[o.id] = o; });
    next.forEach(function (o) { var p = old[o.id]; if (!p || p.u !== o.u || p.del !== o.del) { o.p = 1; if (p && p.s) o.s = 1; } });
  }
  function remotePullOps() {
    return SB.rest('GET', 'ops?select=id,type,usd,price,t,extra,created_at,updated_at,deleted&order=t').then(function (rows) {
      var srv = {}, out = [];
      (rows || []).forEach(function (r) { srv[r.id] = rowToOp(r); });
      S.real.forEach(function (o) { if (o.p && !(srv[o.id] && srv[o.id].u > o.u)) { srv[o.id] = o; } });   // lo que falta subir se queda
      Object.keys(srv).forEach(function (id) { out.push(srv[id]); });
      S.real = out; memo.src = null; saveReal(); SYNC.lastPull = NOW();
    });
  }
  /* Sube lo pendiente, una operación por vez. Si el servidor no la acepta (24 h, cuota, mes pagado), se trae su versión. */
  function remotePushOps() {
    var pend = S.real.filter(function (o) { return o.p; });
    var rejected = [];
    return pend.reduce(function (chain, o) {
      return chain.then(function () {
        var body = opToRow(o);
        var req = o.s ? SB.rest('PATCH', 'ops?id=eq.' + encodeURIComponent(o.id), body, 'return=representation')
                      : SB.rest('POST', 'ops', body, 'return=representation');
        return req.then(function (rows) {
          var r = rows && rows[0]; if (!r) return;
          var n = rowToOp(r); Object.keys(n).forEach(function (k) { o[k] = n[k]; }); delete o.p;
        }, function (e) {
          if (e.offline) throw e;
          if (!o.s && (e.code === '23505' || e.status === 409)) { o.s = 1; return; }          // ya existía: se sube como cambio la próxima vez
          rejected.push({ o: o, e: e }); delete o.p;
        });
      });
    }, Promise.resolve()).then(function () {
      if (rejected.length) {
        var e = rejected[0].e;
        toast({ title: 'El servidor no aceptó un cambio', sub: e.message, tone: 'loss', ms: 6000 });
        return remotePullOps();
      }
    });
  }
  function remoteSync(force) {
    if (!REMOTE || !SB.session() || SYNC.busy) return Promise.resolve();
    SYNC.busy = true;
    return remotePushOps()
      .then(function () { return remotePullOps(); })
      .then(function () { return remotePullAccount(); })
      .then(function () { SYNC.busy = false; SYNC.err = ''; S.cloud = { status: 'ok', at: NOW(), msg: '' }; if (!S.entry && !S.sheet) render(); },
            function (e) { SYNC.busy = false; SYNC.err = sbMsg(e); S.cloud = { status: e && e.offline ? 'offline' : 'error', at: NOW(), msg: SYNC.err }; if (!S.entry && !S.sheet) render(); });
  }
  function remoteSoon() { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(function () { remoteSync(); }, 600); }

  /* ---------- registro y entrada con el servidor ---------- */
  function rRegGo() {

      var p = byId[x.user_id] || { nick: '?' }, hrs = Math.floor((now - ms(x.created_at)) / 3600000), over = hrs >= 48;
      return '<div class="fm"><div class="fm-t"><b>' + esc(p.nick) + ' · ' + EVAcc.monthName(x.month) + '</b><span>' + EV.money(+x.amount) + ' CUP · operación <b class="mono">' + esc(x.op_number || '') + '</b></span>' +
        '<span class="' + (over ? 'susr' : '') + '">Enviado hace ' + (hrs < 1 ? 'menos de 1 hora' : hrs + (hrs === 1 ? ' hora' : ' horas')) + (over ? ' · ya está bloqueado hasta que confirmes' : ' · se bloquea a las 48 h') + '</span></div>' +
        '<div class="adact"><button class="btn sm primary" data-act="ad-ok" data-u="' + x.user_id + '" data-k="' + x.month + '">Confirmar</button><button class="btn sm danger" data-act="ad-no" data-u="' + x.user_id + '" data-k="' + x.month + '">Rechazar</button></div></div>';
    }).join('') + '</div>' : '<p class="fine2">No hay pagos por revisar.</p>');
    var gone = all.filter(function (p) { return p.cancelled_at; });
    if (gone.length) h += '<p><b>Cuentas canceladas (' + gone.length + ')</b></p><div class="flist">' + gone.map(function (p) {
      return '<div class="fm"><div class="fm-t"><b>' + esc(p.nick) + '</b><span>' + esc(p.email) + ' · cancelada el ' + fmtDate(ms(p.cancelled_at)) + '</span></div>' +
        '<div class="adact"><button class="btn sm" data-act="ad-restore" data-u="' + p.id + '">Reactivar</button></div></div>';
    }).join('') + '</div>';
    h += '<p><b>Perfiles</b></p><div class="adlist">' + all.map(function (p) {
      var st = p.cancelled_at ? 'Cancelada' : p.blocked ? 'Bloqueado' : +p.owed > 0 ? 'Debe ' + EV.money(+p.owed) : 'Al día';
      return '<div class="adu"><div><b>' + esc(p.nick) + '</b><span>' + esc(p.email) + (p.phone ? ' · ' + esc(p.phone) : '') + '</span><span>' + esc(p.zone ? EVPlaces.label(p.zone) : 'Sin zona') +
        ' · alta ' + fmtDate(ms(p.created_at)) + (p.ref_slug ? ' · invitado por ' + esc(p.ref_slug) : '') + '</span></div><span class="adst">' + st + '<small>' + (p.gems || 0) + ' gemas</small></span></div>';
    }).join('') + '</div>';
    return h;
  }
  function rAdminAct(kind, el) {
    var A = S.adm, done = function (msg) { toast({ title: msg, ms: 3000 }); A.list = null; rAdminLoad(); };
    var fail = function (e) { toast({ title: 'No se pudo', sub: sbMsg(e), tone: 'loss', ms: 4000 }); };
    if (kind === 'tm') return SB.rest('PATCH', 'app_config?key=eq.tm_dest', { value: String(A.tm || '').trim().slice(0, 40) }).then(function () { REG.cfg.tm = String(A.tm || '').trim(); done('Número de cobro guardado'); }, fail);
    if (kind === 'cash') {
      var c = EVAcc.normCash(A.cash); A.err = '';
      if (!c) { A.err = 'El código tiene la forma EV-XXXXXX.'; return drawSheet(); }
      return SB.rpc('confirm_cash', { p_code: c }).then(function (txt) { A.cash = ''; done('Cobro confirmado · ' + txt); }, function (e) { A.err = sbMsg(e); drawSheet(); });
    }
    var u = el.getAttribute('data-u'), k = el.getAttribute('data-k');
    if (kind === 'ok' || kind === 'no') return SB.rest('PATCH', 'payments?user_id=eq.' + u + '&month=eq.' + k, { status: kind }).then(function () { done(kind === 'ok' ? 'Pago confirmado' : 'Pago rechazado'); }, fail);
    if (kind === 'cancel' || kind === 'restore') {
      var p = (A.list || []).filter(function (x) { return x.id === u; })[0] || { nick: '' };
      if (kind === 'restore') return SB.rpc('admin_set_cancelled', { p_user: u, p_cancel: false }).then(function () { done('Cuenta reactivada · ' + p.nick); }, fail);
      return ask({ title: 'Cancelar la cuenta de ' + p.nick, text: 'No podrá entrar, sus ofertas se borran y sus precios dejan de contar en el escáner. Puedes reactivarla después.', ok: 'Cancelar cuenta', no: 'Volver', danger: true,
        onOk: function () { SB.rpc('admin_set_cancelled', { p_user: u, p_cancel: true }).then(function () { done('Cuenta cancelada · ' + p.nick); }, fail); } });
    }
  }

  /* ---------- pintar todo ---------- */
  function render() {
    if (!me()) { S._tab = null; $('#view').innerHTML = authView(); return; }
    var b = book(), scr = $('#screen'), y = scr && S._tab === S.tab ? scr.scrollTop : 0;
    S._tab = S.tab;
    if (S.tab === 'offers') loadOfs();
    var inner = S.tab === 'home' ? viewHome(b) : S.tab === 'offers' ? viewOffers() : S.tab === 'hist' ? viewHist(b) : S.tab === 'gains' ? viewGains(b) : viewCfg();
    $('#view').innerHTML = (S.mode === 'demo' ? DEMO_BAR : '') + topbar() + (S.tab === 'home' || S.tab === 'offers' ? '' : strip(b)) + inner + (S.tab === 'home' ? dock() : '') + tabsBar();
    var s2 = $('#screen'); if (s2) s2.scrollTop = y;
    lastDay = EV.sod(NOW());
  }

  /* ---------- eventos ---------- */
  var ACT = {
    tab: function (el) { S.tab = el.getAttribute('data-tab'); S.sel = null; clearTimeout(toastTimer); S.toast = null; drawToast(); render(); },
    hide: function () { S.hide = !S.hide; savePrefs(); render(); },
    'new': function (el) { openEntry(el.getAttribute('data-type')); },
    edit: function (el) { openEntry(null, el.getAttribute('data-id')); },
    'entry-close': closeEntry,
    focus: function (el) { if (S.entry) setActive(el.getAttribute('data-f')); },
    key: function (el) { pressKey(el.getAttribute('data-k')); },
    primary: onPrimary,
    'chip-all': function () { var c = entryCalc(); S.entry.qty = rawStr(c.pv.usdBefore); if (!(EV.num(S.entry.price) > 0)) S.entry.active = 'price'; updateEntry(); },
    'chip-last': function () { var l = lastPrice(S.entry.type, S.entry.id); if (l != null) { S.entry.price = rawStr(l); updateEntry(); } },
    'when-toggle': function () { S.entry.showTime = !S.entry.showTime; drawWhen(); },
    'when-now': function () { S.entry.t = null; drawWhen(); updateEntry(); },
    'entry-delete': entryDelete,
    gm: function (el) { S.gm = el.getAttribute('data-m'); S.sel = null; render(); },
    bar: function (el) { S.sel = +el.getAttribute('data-i'); render(); },
    'toast-x': function () { clearTimeout(toastTimer); S.toast = null; drawToast(); },
    undo: function () { var t = S.toast; if (t && t.undo) { t.undo(); toast({ title: 'Deshecho', ms: 2500 }); } },
    'dlg-ok': function () { var d = S.dialog; S.dialog = null; drawDialog(); if (d && d.onOk) d.onOk(); },
    'dlg-no': function () { S.dialog = null; drawDialog(); },
    'sheet-open': function (el) { openSheet(el.getAttribute('data-sheet')); },
    'sheet-close': closeSheet,
    copy: copyBackup,
    'save-file': saveFile,
    'restore-go': restoreGo,
    'cloud-toggle': function () { S.cloudOn = !S.cloudOn; savePrefs(); cloud.setEnabled(S.cloudOn); render(); },
    'cloud-sync': function () { cloud.syncNow(); },
    'cloud-del': cloudDelete,
    'demo-on': demoOn,
    'demo-off': demoOff,
    wipe: wipe,
    'scan-open': openScan,
    'scan-close': closeScan,
    'scan-again': function () { if (S.scan) runScan(); },
    'scan-skip': function () { if (S.scan && SC.raf) finishScan(); },
    'scan-own': function () { if (S.scan) { SC.ownOnly = !SC.ownOnly; runScan(); } },
    'zone-open': function () { S.zoneFirst = false; openSheet('zone'); },
    'zone-pick': function (el) { setZone(el.getAttribute('data-z')); },
    auth: function (el) { var A = S.auth; A.step = el.getAttribute('data-step'); A.err = {}; if (A.step !== 'verify') A.f.pass = A.f.pass2 = ''; render(); var f = document.querySelector('.auth input'); if (f && f.focus && A.step !== 'welcome') f.focus(); },
    'reg-go': regGo, 'login-go': loginGo, 'login-code': loginCode, 'code-go': codeGo, 'code-resend': codeResend, 'code-link': function () { rCodeLink(false); },
    logout: function () { ask({ title: 'Cerrar sesión', text: 'Tus operaciones se quedan guardadas en este teléfono. Para volver, entras con tu correo y tu contraseña.', ok: 'Cerrar sesión', onOk: logout }); },
    'tg-open': function () { var a = me(); if (a && !a.tg) { a.tg = 1; saveReg(); } if (S.sheet === 'tg') setTimeout(closeSheet, 300); },
    'sync-now': function () { remoteSync(true).then(function () { toast({ title: SYNC.err ? 'No se pudo sincronizar' : 'Sincronizado', sub: SYNC.err, tone: SYNC.err ? 'loss' : '', ms: 3000 }); }); },
    'pass-save': passSave, 'np-go': npGo, 'phone-save': phoneSave,
    'pw-show': function () { S.auth.show = !S.auth.show; render(); },
    'pf-show': function () { S.pf.show = !S.pf.show; drawSheet(); },
    'phone-del': function () { if (REMOTE) { S.pf = null; closeSheet(); return rProfilePatch({ phone: null }, 'Teléfono quitado').then(render); } var a = me(); delete a.phone; a.phone = null; saveReg(); S.pf = null; closeSheet(); render(); toast({ title: 'Teléfono quitado', ms: 2500 }); },
    'ref-share': refShare, 'ref-copy': function () { copyText(shareText(), 'Enlace copiado'); },
    'pay-open': function (el) { S.pay = { key: el.getAttribute('data-k'), m: null, op: '', err: '' }; var a = me(), p = a.pay && a.pay[S.pay.key]; if (p && p.st === 'code') S.pay.m = 'cash'; openSheet('pay'); },
    'pay-m': function (el) { S.pay.m = el.getAttribute('data-m'); S.pay.err = ''; drawSheet(); },
    'pay-tm': payTm, 'pay-cash': payCash, 'pay-gems': payGems,
    'calc-m': function (el) { S.calc.m = el.getAttribute('data-m'); drawSheet(); },
    'calc-avg': function () { var b = EV.replay(S.mode === 'demo' ? S.demo : S.real); S.calc.c = String(Math.round(b.avg * 100) / 100); drawSheet(); },
    'ad-reload': function () { S.adm.loadErr = ''; S.adm.list = null; drawSheet(); },
    'terms-tick': function () { var A = S.auth; A.f.terms = !A.f.terms; if (A.f.terms) delete A.err.terms; render(); },
    'terms-ok': termsAccept,
    'ch-block': chBlock, 'ch-report': function () { S.rp = { reason: '', note: '', err: '' }; openSheet('report'); },
    'rp-reason': function (el) { S.rp.reason = el.getAttribute('data-r'); S.rp.err = ''; drawSheet(); },
    'rp-go': reportGo,
    'blk-del': function (el) { blkDel(el.getAttribute('data-u')); },
    'ad-rep-done': function (el) { repDone(el.getAttribute('data-id')); },
    'ad-rep-cancel': function (el) { if (REMOTE) return rAdminAct('cancel', el); ACT['ad-cancel'](el); },
    'acc-delete': accDelete,
    'ad-tm': function () { if (REMOTE) return rAdminAct('tm'); REG.cfg.tm = String(S.adm.tm || '').trim().slice(0, 40); saveReg(); toast({ title: 'Número de cobro guardado', ms: 2500 }); },
    'ad-cash': function () { if (REMOTE) return rAdminAct('cash'); S.adm.err = ''; adCash(); },
    'ad-ok': function (el) { if (REMOTE) return rAdminAct('ok', el); adSet(el, 'ok'); },
    'of-side': function (el) { S.of.side = el.getAttribute('data-s'); render(); },
    'of-where': function (el) { S.of.where = el.getAttribute('data-w'); render(); },
    'of-new': function () { var a = me(); S.ofn = { k: S.of.side === 'buy' ? 'sell' : 'buy', usd: '', price: '', contact: a && a.phone ? 'phone' : 'chat', err: blocked() ? 'Paga la cuota para publicar. Ver ofertas sigue gratis.' : '' }; openSheet('offer-new'); },
    'of-del': ofDel, 'ad-cancel': function (el) { return REMOTE ? rAdminAct('cancel', el) : adCancel(el); }, 'ad-restore': function (el) { return REMOTE ? rAdminAct('restore', el) : adRestore(el); },
    'ofn-k': function (el) { S.ofn.k = el.getAttribute('data-k'); drawSheet(); },
    'ofn-c': function (el) { S.ofn.contact = el.getAttribute('data-c'); S.ofn.err = ''; drawSheet(); },
    'ofn-go': ofNewGo, 'chat-open': chatOpen, 'chat-send': chatSend, 'ad-no': function (el) { if (REMOTE) return rAdminAct('no', el); adSet(el, 'no'); },
    'share-toggle': function () { S.share = !S.share; savePrefs(); reconcileOutbox(); if (S.sheet === 'share') drawSheet(); render(); }
  };
  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el) return;
    if (el.getAttribute('data-self') && ev.target !== el) return;
    var fn = ACT[el.getAttribute('data-act')];
    if (fn) fn(el, ev);
  });
  function onFormChange(ev) {
    var t = ev.target;
    if (!t) return;
    if (t.id === 'e-dt' && S.entry) {
      var v = EV.fromLocalInput(t.value);
      if (!isNaN(v)) S.entry.t = Math.min(v, NOW());
      var w = $('#e-wtxt'); if (w && S.entry.t != null) w.textContent = EV.fmtDay(S.entry.t, NOW()) + ', ' + EV.fmtTime(S.entry.t);
      updateEntry();
    } else if (t.getAttribute && t.getAttribute('data-af') && S.auth) {
      var ak = t.getAttribute('data-af');
      S.auth.f[ak] = t.value;
      if (S.auth.err[ak]) {                          // al corregir un campo se quita su aviso (sin repintar: no se pierde el foco)
        delete S.auth.err[ak];
        var lb = t.closest ? t.closest('.af') : null, ee = lb && lb.querySelector('.afe');
        if (lb) lb.classList.remove('bad'); if (ee) ee.parentNode.removeChild(ee); t.removeAttribute('aria-invalid');
      }
    } else if (t.getAttribute && t.getAttribute('data-rp') && S.rp) {
      S.rp.note = t.value;
    } else if (t.getAttribute && t.getAttribute('data-pf') && S.pf) {
      S.pf[t.getAttribute('data-pf')] = t.value;
    } else if (t.getAttribute && t.getAttribute('data-pay') && S.pay) {
      S.pay[t.getAttribute('data-pay')] = t.value;
    } else if (t.getAttribute && t.getAttribute('data-ad') && S.adm) {
      S.adm[t.getAttribute('data-ad')] = t.value; if (t.getAttribute('data-ad') === 'tm') S.adm.tmTouched = true;
    } else if (t.getAttribute && t.getAttribute('data-ofn') && S.ofn) {
      S.ofn[t.getAttribute('data-ofn')] = t.value; var pv = $('#of-prev'); if (pv) pv.innerHTML = ofPreview();
    } else if (t.id === 'ch-in' && S.chat) {
      S.chat.text = t.value;
    } else if (t.getAttribute && t.getAttribute('data-cf') && S.calc) {
      if (t.value !== S.calc[t.getAttribute('data-cf')]) { S.calc[t.getAttribute('data-cf')] = t.value; var co = $('#calc-out'); if (co) co.innerHTML = calcOut(); }
    } else if (t.id === 'zq') {
      // solo al escribir: si también se repintara al salir del campo ("change"), la lista cambiaría justo al tocar un municipio y se perdería la selección
      if (ev.type === 'input' && t.value !== S.zq) { S.zq = t.value; drawZoneList(false); }
    } else if (t.id === 'fileIn' && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () { var ta = $('#tx'); if (ta) ta.value = String(fr.result || ''); };
      fr.readAsText(t.files[0]);
    }
  }
  document.addEventListener('change', onFormChange);
  document.addEventListener('input', onFormChange);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (S.dialog) { S.dialog = null; drawDialog(); return; }
      if (S.sheet) { closeSheet(); return; }
      if (S.scan) { closeScan(); return; }
    }
    if (ev.key === 'Enter' && !ev.shiftKey && ev.target && ev.target.id === 'ch-in' && S.chat) { ev.preventDefault(); chatSend(); return; }
    if (ev.key === 'Enter' && !S.entry && !S.dialog && ev.target && ev.target.tagName === 'INPUT') {
      var fa = ev.target.getAttribute('data-af') ? (S.auth && { register: 'reg-go', login: 'login-go', verify: 'code-go', newpass: 'np-go' }[S.auth.step]) :
        ev.target.getAttribute('data-pf') ? (S.sheet === 'pass' ? 'pass-save' : 'phone-save') : ev.target.getAttribute('data-pay') ? 'pay-tm' : ev.target.id === 'ad-cash' ? 'ad-cash' : null;
      if (fa && ACT[fa]) { ev.preventDefault(); ACT[fa](ev.target); return; }
    }
    if (!S.entry || S.dialog) return;
    var t = ev.target, k = ev.key;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (/^[0-9]$/.test(k)) { pressKey(k); ev.preventDefault(); }
    else if (k === '.' || k === ',') { pressKey('.'); ev.preventDefault(); }
    else if (k === 'Backspace') { pressKey('back'); ev.preventDefault(); }
    else if (k === 'Enter') {
      var act = t && t.getAttribute ? t.getAttribute('data-act') : null;
      if (act && act !== 'focus' && act !== 'key') return;      // los demás botones hacen lo suyo con Enter
      onPrimary(); ev.preventDefault();
    }
    else if (k === 'Escape') closeEntry();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (S.scan && SC.raf) finishScan();            // en segundo plano el navegador frena la animación: se termina de golpe
    if (cloud) cloud.touch();
    if (EV.sod(NOW()) !== lastDay && !S.entry) render();
  });
  setInterval(function () { if (!S.entry && !S.sheet && !S.dialog && EV.sod(NOW()) !== lastDay) render(); }, 30000);

  /* ---------- arranque ---------- */
  /* Las capacidades de la plataforma (copia en la nube, guardar archivo) pueden tardar o no existir:
     se esperan unos segundos y, si no aparecen, la app sigue igual solo con lo del teléfono. */
  function useCap(name) {
    return new Promise(function (resolve) {
      var tries = 0;
      (function look() {
        if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') {
          try { resolve(claude.use(name)); } catch (e) { resolve(null); }
          return;
        }
        if (++tries > 30) return resolve(null);
        setTimeout(look, 100);
      })();
    });
  }
  loadOfs();
  var LINK = REMOTE ? linkFromHash() : null;
  if (LINK) {                                                                    // viene de tocar el enlace de un correo
    if (me()) { REG.cur = null; saveReg(); }
    authInit(); render(); openLink(LINK);
  } else {
  if (REMOTE && me() && !SB.session()) { REG.cur = null; saveReg(); }          // la sesión del servidor se cerró: hay que entrar otra vez
  if (me()) enterAccount(); else { authInit(); render(); }
  }
  if (REMOTE && 'serviceWorker' in navigator && /^https:/.test(location.href) && location.hostname !== 'localhost') {      // abrir la app sin internet
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
  if (REMOTE) {
    if (me()) remoteSync();
    setInterval(function () { if (me()) remoteSync(); }, 60000);
    window.addEventListener('online', function () { if (me()) remoteSync(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (me()) remoteSync();
      else if (S.auth && S.auth.step === 'verify' && S.auth.code && S.auth.code.purpose === 'register') rCodeLink(true);   // volvió del correo: prueba a entrar solo
    });
  }
  useCap('downloads').then(function (d) {
    if (d && typeof d.save === 'function') { dlApi = d; S.dl = true; if (S.sheet === 'backup') drawSheet(); }
  }, function () {});
  (function () {                                                 // pantalla de carga (solo la versión publicada): se va cuando la app ya está lista
    var sp = document.getElementById('splash'); if (!sp) return;
    setTimeout(function () { sp.style.opacity = '0'; setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 450); }, Math.max(0, 900 - (Date.now() - (window.EV_T0 || 0))));
  })();
  window.__EV_DEBUG = { S: S, render: render, book: book, OB: function () { return OB; }, SC: SC, community: community, REG: REG, K: K, me: me, feeState: feeState, OFS: function () { return OFS; } };       // solo para pruebas
})();
